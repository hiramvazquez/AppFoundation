# CI de AppFoundation (repositorio del paquete, publicado desde el monorepo spm-pro por
# `git subtree split`). Comprobaciones: lint estricto; build con warnings como errores +
# tests en macOS + build iOS Simulator; los cuatro ejemplos de variante (LoginApp y
# CatalogApp resuelven CoreNetworking desde su repositorio); el generador y el linter de
# arquitectura probados en un paquete temporal; DocC (snippets sincronizados + docbuild
# sin warnings).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: swift format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift format lint --strict --recursive Sources Tests Examples Plugins Snippets

  test:
    name: build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests
      - name: swift test --parallel
        run: swift test --parallel
      - name: iOS Simulator
        run: xcodebuild build -scheme AppFoundation -destination 'generic/platform=iOS Simulator' -quiet

  example:
    name: Examples/${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [CounterApp, NotesApp, LoginApp, CatalogApp]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
        working-directory: Examples/${{ matrix.example }}

  generator:
    name: generate-feature + ArchitectureLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: Scripts/verify-generator.sh

  multi:
    name: archinit --multi + generate-feature + R13
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version && swift --version
      - run: brew install xcodegen
      - run: Scripts/verify-multi.sh

  quality:
    name: SwiftLint --strict (Templates/swiftlint.yml sobre ejemplos y snippets)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint && swiftlint version
      - name: Ejemplos y snippets con la configuración curada
        run: |
          set -e
          for e in CounterApp NotesApp LoginApp CatalogApp; do
            swiftlint lint --strict --quiet --config Templates/swiftlint.yml Examples/$e/Sources Examples/$e/Tests
          done
          swiftlint lint --strict --quiet --config Templates/swiftlint.yml Snippets

  docs:
    name: DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Snippets en línea sincronizados
        run: Scripts/check-doc-snippets.sh
      - name: docbuild sin warnings
        run: |
          set -o pipefail
          for dest in 'generic/platform=iOS Simulator' 'platform=macOS'; do
            log=$(xcodebuild docbuild -scheme AppFoundation -destination "$dest" -derivedDataPath "$(mktemp -d)" 2>&1) || true
            echo "$log" | grep -E "warning:|error:|\*\* BUILD" | sort -u || true
            echo "$log" | grep -q "BUILD DOCUMENTATION SUCCEEDED" || exit 1
            ! echo "$log" | grep -qE "warning:|error:"
          done

  archlint-self:
    name: archlint (R16) sobre las fuentes del propio paquete
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift build --product archlint
      - run: .build/debug/archlint --root . Sources/AppFoundation Snippets

  # PRD (verificación del contrato de cancelación de ScreenContainer, sept. 2026): la mitad
  # NO cubierta por `swift test` de `ScreenContainer(cancelsInFlightWorkOnRemoval:)` — que
  # SwiftUI cancele el `.task` de una pantalla solo al eliminarla de la jerarquía, nunca al
  # taparla con un push — verificada antes solo a mano (ver el doc comment de
  # `ScreenContainerCancellationTests.swift`). `Scripts/verify-lifecycle-contract.sh` monta
  # una app real (`Sources/LifecycleContractProbeApp/`, un ejecutable, no un test) con una
  # ventana de verdad y reproduce la secuencia push → push → pop, saliendo con exit != 0 si
  # el orden observado no es el esperado.
  #
  # Confirmado en un run real (AppFoundation, 306d677, 2026-09-05): los runners `macos-15`
  # SÍ dan WindowServer a una app con ventana que no es un target de UI tests. El job pasó
  # por el motivo correcto — el log trae la secuencia completa, incluida la aserción de que
  # B NO se cancela mientras está tapada — así que bloquea de verdad, sin `continue-on-error`.
  # Un gate que no puede fallar no es un gate.
  lifecycle-contract-probe:
    name: ScreenContainer — cancela solo al eliminar, nunca al tapar (probe con ventana real)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: Scripts/verify-lifecycle-contract.sh
